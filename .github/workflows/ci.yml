name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install chromium
      - name: Test backend and WebView UI
        run: python -m pytest tests --ignore=tests/test_gui_flow.py -q
      - name: Test legacy Qt UI separately
        run: python -m pytest tests/test_gui_flow.py -q
