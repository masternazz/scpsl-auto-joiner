<!doctype html>
<html lang="en" class="app-theme">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCP:SL // Containment</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-seal">S</div><div><strong>SCP:SL</strong><span>CONTAINMENT / 0.4</span></div></div><button class="collapse" id="collapse" aria-label="Collapse navigation">&#8249;</button><div class="rule"></div><nav aria-label="Primary navigation">
    <button class="nav-item active" data-page="join"><span>01</span>Auto-Join</button><button class="nav-item" data-page="servers"><span>02</span>Servers</button><button class="nav-item" data-page="packs"><span>03</span>Text Packs</button><button class="nav-item" data-page="diagnostics"><span>04</span>Diagnostics</button><button class="nav-item" data-page="settings"><span>05</span>Settings</button><button class="nav-item" data-page="help"><span>06</span>Help</button>
  </nav><div class="sidebar-foot"><small>LOCAL DESKTOP TOOL</small><p>Server data stays on this PC.</p><span class="version" id="versionLabel">BUILD 0.3.7 / WEBVIEW2</span></div></aside>
  <main class="main"><header class="topbar"><button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">&#9776;</button><span id="crumb">AUTO-JOIN</span><div class="top-status"><span class="dot" id="gameDot"></span><span id="gameStatus">CHECKING GAME</span><span class="mode" id="inputMode">AUTOMATIC INPUT</span></div></header>
  <div id="content" class="content"><section class="boot-state" aria-live="polite"><div class="boot-mark">S</div><h1>Starting containment tools</h1><p>Connecting to the local application bridge&hellip;</p><div class="boot-progress"><i></i></div></section></div></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="confirmModal" class="modal-backdrop" hidden>
  <section class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
    <div class="modal-kicker">CONFIRM ACTION</div>
    <h2 id="confirmTitle">Are you sure?</h2>
    <p id="confirmMessage"></p>
    <div class="modal-actions">
      <button class="button" id="confirmCancel">Cancel</button>
      <button class="button primary" id="confirmAccept">Continue</button>
    </div>
  </section>
</div>
<script src="app.js"></script><script src="parity.js"></script>
</body></html>
